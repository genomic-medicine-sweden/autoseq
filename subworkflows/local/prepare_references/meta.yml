# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/subworkflows/yaml-schema.json
name: "prepare_references"
description: Prepare directory-type reference genome resources by building the BWA-MEM2 index on the fly and untarring the VEP cache, GRIDSS index and HMF ensembl_data directories
keywords:
  - reference
  - index
  - bwamem2
  - untar
  - vep
components:
  - bwamem2/index
  - untar
input:
  - val_genome_fasta:
      type: string
      description: |
        Path to the genome FASTA used to build the BWA-MEM2 index on the fly
      pattern: "*.{fa,fasta}"
  - val_bwamem2_index:
      type: string
      description: |
        Path to a pre-built BWA-MEM2 index directory. When set, the index is
        used as-is instead of being built from the genome FASTA.
  - val_ensembl_vep_cache:
      type: string
      description: |
        Path to the Ensembl VEP cache directory or a .tar.gz archive of it.
        Paths ending with .tar.gz are untarred, otherwise used as-is.
  - val_gridss_index:
      type: string
      description: |
        Path to the GRIDSS index directory or a .tar.gz archive of it.
        Paths ending with .tar.gz are untarred, otherwise used as-is.
  - val_hmf_ensembl_data:
      type: string
      description: |
        Path to the HMF ensembl_data directory or a .tar.gz archive of it.
        Paths ending with .tar.gz are untarred, otherwise used as-is.
output:
  - genome_fasta:
      type: file
      description: |
        Genome FASTA staged with a meta map
        Structure: [ val(meta), path(fasta) ]
      pattern: "*.{fa,fasta}"
  - bwamem2_index:
      type: directory
      description: |
        BWA-MEM2 index built from the genome FASTA
        Structure: [ val(meta), path(index) ]
  - vep_cache:
      type: directory
      description: |
        Untarred VEP cache directory
        Structure: [ val(meta), path(dir) ]
  - gridss_index:
      type: directory
      description: |
        Untarred GRIDSS index directory
        Structure: [ val(meta), path(dir) ]
  - hmf_ensembl_data:
      type: directory
      description: |
        Untarred HMF ensembl_data directory
        Structure: [ val(meta), path(dir) ]
authors:
  - "@imsarath"
maintainers:
  - "@imsarath"
