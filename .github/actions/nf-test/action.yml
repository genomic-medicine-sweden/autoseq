name: "nf-test Action"
description: "Runs nf-test with common setup steps"
inputs:
  profile:
    description: "Profile to use"
    required: true
  shard:
    description: "Shard number for this CI job"
    required: true
  total_shards:
    description: "Total number of test shards(NOT the total number of matrix jobs)"
    required: true
  paths:
    description: "Test paths"
    required: true
  tags:
    description: "Tags to pass as argument for nf-test --tag parameter"
    required: false
runs:
  using: "composite"
  steps:
    - name: Setup Nextflow
      uses: nf-core/setup-nextflow@893c28b667aedeba26e37f296d260ccc5bc4d914 # v3
      with:
        version: "${{ env.NXF_VERSION }}"

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
      with:
        python-version: "3.14"

    - name: Install nf-test
      uses: nf-core/setup-nf-test@4069fbbaabe94c08faba4ad261bfa88225ba133f # v2
      with:
        version: "${{ env.NFT_VER }}"
        install-pdiff: true

    - name: Setup apptainer
      if: contains(inputs.profile, 'singularity')
      uses: eWaterCycle/setup-apptainer@3f706d898c9db585b1d741b4692e66755f3a1b40 # v2.0.0

    - name: Set up Singularity
      if: contains(inputs.profile, 'singularity')
      shell: bash
      run: |
        mkdir -p $NXF_SINGULARITY_CACHEDIR
        mkdir -p $NXF_SINGULARITY_LIBRARYDIR

    - name: Conda setup
      if: contains(inputs.profile, 'conda')
      uses: conda-incubator/setup-miniconda@8ee1f361103df19b6f8c8655fd3967a8ecb162d5 # v4
      with:
        auto-update-conda: true
        conda-solver: libmamba
        channels: conda-forge
        channel-priority: strict
        conda-remove-defaults: true

    # TEMPORARY (diagnostic): shards intermittently take ~70 min instead of ~20 min, with a
    # single ~57 min window in which several unrelated tasks stall and then all complete
    # within seconds of each other. Unlike sarek and oncoanalyser we run on GitHub-hosted
    # runners (~14 GB disk, no reference cache), so record disk before/after to see whether
    # the container set and staged references exhaust it. Remove once the cause is fixed.
    - name: Record disk usage before tests
      shell: bash
      run: |
        echo "### Disk before tests" >> $GITHUB_STEP_SUMMARY
        df -h / /mnt 2>/dev/null | tee -a $GITHUB_STEP_SUMMARY

    - name: Run nf-test
      shell: bash
      env:
        NFT_WORKDIR: ${{ env.NFT_WORKDIR }}
      run: |
        nf-test test \
          --profile=+${{ inputs.profile }} \
          $(if [ -n "${{ inputs.tags }}" ]; then echo "--tag ${{ inputs.tags }}"; fi) \
          --ci \
          --changed-since HEAD^ \
          --verbose \
          --tap=test.tap \
          --shard ${{ inputs.shard }}/${{ inputs.total_shards }}

          # Save the absolute path of the test.tap file to the output
          echo "tap_file_path=$(realpath test.tap)" >> $GITHUB_OUTPUT

    # TEMPORARY (diagnostic): companion to "Record disk usage before tests". The Nextflow
    # trace separates the three candidate causes: time inside the task with low %cpu means
    # blocked on I/O or network, `duration` far above `realtime` means queued or staging,
    # and a high %cpu means genuinely compute-bound. Remove once the cause is fixed.
    - name: Report disk usage and task timings
      if: always()
      shell: bash
      run: |
        echo "### Disk after tests" >> $GITHUB_STEP_SUMMARY
        df -h / /mnt 2>/dev/null | tee -a $GITHUB_STEP_SUMMARY
        docker system df 2>/dev/null | tee -a $GITHUB_STEP_SUMMARY || true
        python3 - <<'PY' | tee -a $GITHUB_STEP_SUMMARY
        import glob, re, html

        reports = sorted(glob.glob('**/pipeline_info/execution_report_*.html', recursive=True))
        if not reports:
            print('No execution report found.')

        for report in reports:
            source = open(report, encoding='utf8', errors='replace').read()
            start = source.find('window.data = ')
            if start < 0:
                print(f'{report}: no trace payload')
                continue

            tasks = []
            for match in re.finditer(r'\{"task_id".*?\}', source[start:]):
                blob = match.group(0)

                def field(key, default='0'):
                    hit = re.search(r'"%s":"(.*?)"' % key, blob)
                    return hit.group(1) if hit else default

                tasks.append({
                    'name': html.unescape(field('name', '?')),
                    'realtime': int(field('realtime') or 0),
                    'duration': int(field('duration') or 0),
                    'cpu': field('%cpu', '?'),
                    'rss': field('peak_rss', '?'),
                })

            tasks.sort(key=lambda task: task['duration'], reverse=True)
            print(f'\n### {report} ({len(tasks)} tasks)\n')
            print('| duration | realtime | queued+staged | %cpu | peak_rss | task |')
            print('|---:|---:|---:|---:|---:|---|')
            for task in tasks[:15]:
                print('| %.1fs | %.1fs | %.1fs | %s | %s | %s |' % (
                    task['duration'] / 1000,
                    task['realtime'] / 1000,
                    (task['duration'] - task['realtime']) / 1000,
                    task['cpu'],
                    task['rss'],
                    task['name'][-70:],
                ))
        PY

    - name: Upload Nextflow traces
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: nextflow-trace-${{ inputs.profile }}-${{ env.NXF_VERSION }}-shard${{ inputs.shard }}
        path: |
          **/pipeline_info/execution_*
          **/.nextflow.log*
        if-no-files-found: warn
        include-hidden-files: true
        retention-days: 7

    - name: Generate test summary
      if: always()
      shell: bash
      run: |
        # Add header if it doesn't exist (using a token file to track this)
        if [ ! -f ".summary_header" ]; then
          echo "# 🚀 nf-test results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Status | Test Name | Profile | Shard |" >> $GITHUB_STEP_SUMMARY
          echo "|:------:|-----------|---------|-------|" >> $GITHUB_STEP_SUMMARY
          touch .summary_header
        fi

        if [ -f test.tap ]; then
          while IFS= read -r line; do
            if [[ $line =~ ^ok ]]; then
              test_name="${line#ok }"
              # Remove the test number from the beginning
              test_name="${test_name#* }"
              echo "| ✅ | ${test_name} | ${{ inputs.profile }} | ${{ inputs.shard }}/${{ inputs.total_shards }} |" >> $GITHUB_STEP_SUMMARY
            elif [[ $line =~ ^not\ ok ]]; then
              test_name="${line#not ok }"
              # Remove the test number from the beginning
              test_name="${test_name#* }"
              echo "| ❌ | ${test_name} | ${{ inputs.profile }} | ${{ inputs.shard }}/${{ inputs.total_shards }} |" >> $GITHUB_STEP_SUMMARY
            fi
          done < test.tap
        else
          echo "| ⚠️ | No test results found | ${{ inputs.profile }} | ${{ inputs.shard }}/${{ inputs.total_shards }} |" >> $GITHUB_STEP_SUMMARY
        fi

    - name: Clean up
      if: always()
      shell: bash
      run: |
        sudo rm -rf /home/ubuntu/tests/
